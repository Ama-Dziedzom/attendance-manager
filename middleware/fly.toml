app = 'middleware'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = "production"
  API_PORT = "3001"
  ZKTECO_PORT = "4370"

[processes]
  app = "npm start"

# API + WebSocket service (HTTP/HTTPS)
[[services]]
  internal_port = 3001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

# ZKTeco TCP service (for MB460 connections)
[[services]]
  internal_port = 4370
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 4370

# VM configuration
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1